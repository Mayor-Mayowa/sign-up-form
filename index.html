<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lobster+Two&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="logo-section">
            <div class="logo">
                <img src="./Assets/odin-lined.png">
                <span class="logo-name">ODIN</span>
            </div>
        </div>
        <div class="signup section">
            <div class="message">
               <h1>Create Account</h1>
               <p>Join the family <em>today</em> and start your journey to help you realize your deapest dreams</p>
               <p>sign up now to get started</p>
            </div>
           <form id="signup" action="#">
               <fieldset>
                  <div class="form-row">
                      <label for="firstname">FIRST NAME</label>
                      <input type="text" id="firstname" name="firstname" required>

                      <label for="lastname">LAST NAME</label>
                      <input type="text" id="lastname" name="lastname" required>
                  </div>

                  <div class="form-row">
                      <label for="email">EMAIL</label>
                      <input type="email" id="email" name="email" required>

                      <label for="phone_number">PHONE NUMBER</label>
                      <input type="tel" id="phone_number" name="phone_number">
                  </div>

                  <div class="form-row">
                      <label for="password">PASSWORD</label>
                      <input type="password" id="password" name="password" required>

                      <label for="confirm_password">CONFIRM PASSWORD</label>
                      <input type="password" id="confirm_password" name="confirm_password" required>
                  </div>
               </fieldset>
               <button type="submit" class="submit-btn">Create Account</button>
           </form>
           <p class="login">Already have an account?<a href="./index.html">Log in</a></p>
        </div>
    </div>
</body>
</html>
