<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lobster+Two&family=Patrick+Hand&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="logo-section">
            <div class="logo">
                <img src="./Assets/odin-lined.png">
                <span class="logo-name">ODIN</span>
            </div>
            <p class="photo-credit">
                Photo by <a href="https://unsplash.com/@chrisvomradio?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText">Chris Weiher</a> on <a href="https://unsplash.com/photos/vast-field-of-red-tulips-under-a-cloudy-sky-S-k0BArBfLk?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText">Unsplash</a>
            </p>
        </div>
        <div class="signup-section">
            <div class="message">
               <h1>Create Account</h1>
               <p>Join the family <em>today</em> and start your journey to help you realize your deapest dreams</p>
               <p>sign up now to get started</p>
            </div>
           <form id="signup" action="#">
               <fieldset>
                  <div class="form-row">
                      <div class="input-group">
                          <label for="firstname">FIRST NAME</label>
                          <input type="text" id="firstname" name="firstname" minlength="2" required>
                      </div>
                      <div class="input-group">
                          <label for="lastname">LAST NAME</label>
                          <input type="text" id="lastname" name="lastname" minlength="2" required>
                      </div>
                  </div>

                  <div class="form-row">
                      <div class="input-group">
                          <label for="email">EMAIL</label>
                          <input type="email" id="email" name="email" required>
                      </div>
                     <div class="input-group">
                          <label for="phone_number">PHONE NUMBER</label>
                          <input type="tel" id="phone_number" name="phone_number" minlength="5" required>
                     </div>
                  </div>

                  <div class="form-row">
                      <div class="input-group">
                          <label for="password">PASSWORD</label>
                          <input type="password" id="password" name="password" pattern="(?=.*[A-Z]).{8,}" title="Must contain one uppercase letter and be 8 or more characters long" required>
                      </div>
                      <div class="input-group">
                          <label for="confirm_password">CONFIRM PASSWORD</label>
                          <input type="password" id="confirm_password" name="confirm_password" pattern="(?=.*[A-Z]).{8,}" title="Must contain one uppercase letter and be 8 or more characters long" required>
                      </div>
                  </div>
               </fieldset>
               <button type="submit" class="submit-btn">Create Account</button>
           </form>
           <p class="login">Already have an account?<a href="./index.html">Log in</a></p>
        </div>
    </div>
</body>
</html>
